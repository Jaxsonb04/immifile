appId: dev.uing.immigrationrenewalhelp
---
- tapOn: 'Add a case'
- tapOn:
    id: case-receipt-input
- inputText: '${QA_RECEIPT}'
- tapOn:
    text: 'Done'
    optional: true
- tapOn: 'Save case'
- assertVisible: 'Create an account to save a case'
- scrollUntilVisible:
    element: 'Back to receipt number'
    centerElement: true
- tapOn: 'Back to receipt number'
- assertVisible: '${QA_RECEIPT}'
- tapOn: 'Save case'
- scrollUntilVisible:
    element: 'Already have an account.*'
    centerElement: true
- tapOn: 'Already have an account.*'
- scrollUntilVisible:
    element: 'you@example.com'
    direction: UP
    centerElement: true
- tapOn: 'you@example.com'
- inputText: '${QA_EMAIL}'
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Password'
    centerElement: true
- tapOn: 'Enter your password'
- inputText: '${QA_PASSWORD}'
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Sign in'
    centerElement: true
- tapOn: 'Sign in'
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: '.*${QA_RECEIPT}.*'
    timeout: 30000
- tapOn: '.*${QA_RECEIPT}.*'
- scrollUntilVisible:
    element: 'Remove from Immifile'
    centerElement: true
- tapOn: 'Remove from Immifile'
- tapOn: 'Remove case'
- assertNotVisible: '.*${QA_RECEIPT}.*'
