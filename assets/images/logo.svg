<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
	<!--
    Canonical Immifile mark.

    The lowercase "i" is the product initial. Its stem is also a filing page:
    the pale inset follows a turned sheet of paper and the cobalt corner is the
    page beneath it. Keep this file flat and geometric so the mark remains
    legible as a favicon and an Android themed icon.

    Run `node scripts/generate-logo-assets.mjs` after editing this file. The
    script creates every shipped app, web, adaptive, monochrome, and splash
    asset from this one source.
  -->
	<rect id="ground" width="1024" height="1024" fill="#EAF4FF" />
	<g id="mark">
		<defs>
			<clipPath id="stem-clip">
				<rect x="380" y="380" width="264" height="460" rx="88" />
			</clipPath>
		</defs>
		<circle id="dot" cx="512" cy="260" r="84" fill="#2563EB" />
		<rect id="stem" x="380" y="380" width="264" height="460" rx="88" fill="#16345C" />
		<g clip-path="url(#stem-clip)">
			<path
				id="page"
				fill="#F8FBFF"
				d="M644 430C644 473 618 500 566 535L517 568C492 585 480 606 480 636V679C480 712 495 736 527 757L644 834V430Z"
			/>
			<path
				id="page-accent"
				fill="#2563EB"
				d="M480 679C480 712 495 736 527 757L644 834V840H556C514 840 480 806 480 764V679Z"
			/>
		</g>
	</g>
</svg>
