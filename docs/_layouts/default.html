<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="theme-color" content="#eaf4ff">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Immifile home">
          <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="44" height="44">
          <span>Immifile</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Overview</a>
          <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
          <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
        </nav>
      </div>
    </header>
    <main id="main"{% if page.url == "/" %} class="home"{% endif %} tabindex="-1">{{ content }}</main>
    <footer>Immifile · Independent immigration tools.</footer>
  </body>
</html>
